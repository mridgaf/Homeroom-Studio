<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weights</title>
<style>
:root{--bg:#23262b;--card:#2e3238;--ink:#f1efe6;--dim:#a9a89f;--line:#444952;--y:#f4c430;--b:#5aa9ff;--ok:#7fd18b;--bad:#ff7a7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Helvetica,Arial,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:20px}
.tabs button{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer;margin-right:6px;font-size:14px}
.tabs button.on{background:var(--y);color:#222;border-color:var(--y);font-weight:600}
.how{color:var(--dim);font-size:13px;max-width:560px}
main{display:flex;min-height:calc(100vh - 60px)}
nav{width:210px;border-right:1px solid var(--line);padding:10px;overflow:auto}
nav div{padding:7px 10px;border-radius:6px;cursor:pointer}
nav div:hover{background:var(--card)}
nav div.on{background:var(--b);color:#10202e;font-weight:600}
section{flex:1;padding:16px 22px;max-width:900px}
.listen{color:var(--dim);font-size:13px;margin:0 0 14px}
.g{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.g h3{margin:0 0 2px;font-size:15px}
.g .p{color:var(--dim);font-size:12px;margin-bottom:8px}
.r{display:grid;grid-template-columns:150px 1fr 56px 70px;gap:8px;align-items:center;padding:2px 0}
.r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;background:#1b1d21;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y)}
.r .pc{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=number]{width:70px;background:#1b1d21;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:14px}
.btns{margin-top:8px;display:flex;gap:8px;align-items:center}
.btns button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer}
.btns button.save{background:var(--ok);color:#12281a;border-color:var(--ok);font-weight:600}
.btns button:disabled{opacity:.35;cursor:default}
.msg{font-size:13px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
@media(max-width:700px){main{flex-direction:column}nav{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap}.r{grid-template-columns:100px 1fr 46px 64px}}
</style></head><body>
<header><h1>Weights</h1><div class="tabs" id="tabs"></div>
<div class="how">Each list is a dice roll. The number is how often an option comes up <b>compared to the others</b> &mdash; 2 beside 1 means twice as often. 0 turns it off. The % column is the real chance. Changes apply to the next beat you make.</div></header>
<main><nav id="nav"></nav><section id="sec"></section></main>
<script>
const NICE={
 "signature.key.roots":"Key (root note)","signature.key.mode":"Scale / mode",
 "signature.progressions":"Chord progressions","signature.chord_source":"Chord sound (what plays the chords)",
 "signature.chord_rhythm":"Chord rhythm","signature.pattern_tags":"Chord pattern feel",
 "library.tags":"Groove-library styles it borrows from","chord_grammar.figures":"Chord figures",
 "chord_grammar.shape":"Chord shape","signature.bass_grammar.figures":"Bass figures",
 "grammar.kick.w":"Kick: which of the 16 steps gets a hit"};
function nice(p){const k=p.join(".");if(NICE[k])return NICE[k];
 if(p[0]==="grammar"&&p[2]==="modes")return p[1][0].toUpperCase()+p[1].slice(1)+" pattern styles";
 return k}
let D=null,tab="DJs",cur=0;
const $=s=>document.querySelector(s);
async function load(){D=await (await fetch("/weights-data")).json();draw()}
function draw(){
 $("#tabs").innerHTML=Object.keys(D).map(t=>`<button class="${t===tab?"on":""}" onclick="tab='${t}';cur=0;draw()">${t}</button>`).join("");
 const ids=D[tab].ids;
 $("#nav").innerHTML=ids.map((x,i)=>`<div class="${i===cur?"on":""}" onclick="cur=${i};draw()">${x.name}</div>`).join("");
 const id=ids[cur];
 $("#sec").innerHTML=`<h2 style="margin:0 0 4px">${id.name}</h2><p class="listen">${id.listen||""}</p>`+
  id.groups.map((g,gi)=>group(g,gi)).join("");
}
function group(g,gi){
 const tot=g.items.reduce((a,i)=>a+i[1],0)||1,mx=Math.max(...g.items.map(i=>i[1]),1e-9);
 const rows=g.items.map((it,ri)=>`<div class="r"><span class="n" title="${it[0]}">${it[0]}</span>
  <div class="bar"><i style="width:${100*it[1]/mx}%"></i></div><span class="pc" id="pc${gi}_${ri}">${(100*it[1]/tot).toFixed(1)}%</span>
  <input type="number" min="0" step="any" value="${it[1]}" data-g="${gi}" data-r="${ri}" oninput="edit(this)"></div>`).join("");
 return `<div class="g" id="g${gi}"><h3>${nice(g.path)}</h3><div class="p">${g.path.join(" › ")}</div>${rows}
  <div class="btns"><button class="save" id="s${gi}" disabled onclick="save(${gi})">Save</button>
  <button id="u${gi}" disabled onclick="draw()">Undo</button><span class="msg" id="m${gi}"></span></div></div>`;
}
function vals(gi){return [...document.querySelectorAll(`#g${gi} input`)].map(i=>parseFloat(i.value))}
function edit(el){
 const gi=+el.dataset.g,v=vals(gi),tot=v.reduce((a,x)=>a+(x>0?x:0),0)||1,mx=Math.max(...v,1e-9);
 v.forEach((x,i)=>{const pc=document.getElementById(`pc${gi}_${i}`);pc.textContent=(100*(x>0?x:0)/tot).toFixed(1)+"%";
  document.querySelectorAll(`#g${gi} .bar i`)[i].style.width=(100*(x>0?x:0)/mx)+"%"});
 $("#s"+gi).disabled=$("#u"+gi).disabled=false;$("#m"+gi).textContent="";
}
async function save(gi){
 const id=D[tab].ids[cur],g=id.groups[gi],v=vals(gi),m=$("#m"+gi);
 if(v.some(x=>!(x>=0))||!v.some(x=>x>0)){m.className="msg bad";m.textContent="Numbers must be 0 or more, not all zero.";return}
 const items=g.items.map((it,i)=>[it[0],v[i]]);
 const r=await (await fetch("/weights-save",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({label:tab,name:id.name,path:g.path,items})})).json();
 if(r.ok){g.items=items;m.className="msg ok";m.textContent="Saved. Next beat uses it.";$("#s"+gi).disabled=$("#u"+gi).disabled=true}
 else{m.className="msg bad";m.textContent=r.error}
}
load();
</script></body></html>
