<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper on the Wall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#262626}
*{box-sizing:border-box}
button,select,input{font-family:'Special Elite',monospace;color:#151515}
button{cursor:pointer}
.mk{font-family:'Permanent Marker',cursive;color:#151515}
.card{position:relative;background:#f4efe0;color:#151515;box-shadow:3px 5px 0 rgba(0,0,0,.55);padding:18px 20px}
.tape{position:absolute;top:-12px;left:50%;width:90px;height:24px;margin-left:-45px;background:rgba(222,205,140,.85);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.ruled{background-image:repeating-linear-gradient(transparent 0 29px,#c9d6e6 29px 30px)}
.lab{font-size:14px;display:block;margin-bottom:3px;color:#333}
.fl{width:100%;height:38px;background:#fff;border:2px solid #151515;border-radius:0;padding:0 8px;font-size:16px}
.st{width:40px;height:40px;background:#151515;color:#f4efe0;border:0;font-size:24px;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.lbl{border:0;padding:8px 14px;font-size:18px;color:#151515;background:#d9d2bd;box-shadow:2px 3px 0 rgba(0,0,0,.5)}
.lbl.on{background:#ff8a3d}
.strip{flex:1 1 150px;height:46px;border:0;background:rgba(222,205,140,.92);font-size:17px;color:#151515;box-shadow:1px 2px 0 rgba(0,0,0,.45);clip-path:polygon(0 0,98% 6%,100% 100%,2% 94%)}
.strip.on{background:#ff8a3d}
.stamp{height:38px;padding:0 14px;background:none;border:3px solid #151515;font-size:15px;letter-spacing:.1em;color:#151515;transform:rotate(-3deg)}
.bar{width:3px;flex:none}
.note{aspect-ratio:1/0.95;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;box-shadow:2px 4px 0 rgba(0,0,0,.5);padding:4px}
</style>
</helmet>

<div style="width:100%;min-height:900px;padding:24px 28px 0;background:radial-gradient(circle,#101010 3px,transparent 3.6px) 0 0/30px 30px,#2e2e2e;display:flex;flex-direction:column;gap:22px">

<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<div style="background:#f4efe0;padding:10px 26px 8px;transform:rotate(-1deg);box-shadow:3px 5px 0 rgba(0,0,0,.55);clip-path:polygon(0 4%,3% 0,12% 5%,25% 0,40% 4%,58% 0,75% 5%,90% 0,100% 4%,99% 96%,88% 100%,70% 95%,50% 100%,30% 95%,12% 100%,2% 96%)">
<div class="mk" style="font-size:46px;line-height:1;letter-spacing:.04em">HOMEROOM STUDIOS</div>
<div style="font-size:13px;letter-spacing:.3em;color:#333">MUSIC STARTS HERE</div>
</div>
<img src="/_blob/31c4430f36130632788d41344c8012d5" alt="The Back of the Class logo" style="width:88px;height:88px;object-fit:cover;transform:rotate(4deg);border:4px solid #f4efe0;box-shadow:3px 5px 0 rgba(0,0,0,.55)">
</div>

<div style="display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start">

<div class="card" style="flex:1 1 380px;transform:rotate(-.6deg)">
<span class="tape"></span>
<div class="mk" style="font-size:28px;margin-bottom:10px"><span style="background:#151515;color:#f4efe0;padding:0 10px;margin-right:8px">1</span>Choose your class</div>
<div style="display:flex;gap:8px;margin-bottom:16px">
<button class="lbl {{tab0cls}}" onClick="{{goBack}}">The Back of the Class</button>
<button class="lbl {{tab1cls}}" onClick="{{goLegends}}">The Legends</button>
</div>
<div style="display:flex;gap:12px;justify-content:space-between">
<sc-for list="{{people}}" as="p" hint-placeholder-count="4">
<button onClick="{{p.pick}}" aria-label="{{p.n}}" style="{{p.st}}">
<span class="mk" style="{{p.pic}}">{{p.ini}}</span>
<span style="font-size:13px;color:#151515">{{p.n}}</span>
</button>
</sc-for>
</div>
</div>

<div class="card ruled" style="flex:2 1 600px;transform:rotate(.4deg)">
<span class="tape" style="left:30%"></span>
<div class="mk" style="font-size:28px;margin-bottom:10px"><span style="background:#151515;color:#f4efe0;padding:0 10px;margin-right:8px">2</span>Set your parameters</div>
<div style="display:flex;gap:22px;flex-wrap:wrap;align-items:center">
<div style="flex:1 1 220px;display:flex;flex-direction:column;gap:8px">
<label class="lab" for="ck">Key</label>
<select id="ck" class="fl" value="{{key}}" onChange="{{onKey}}"><option>A Minor</option><option>C Minor</option><option>D Minor</option><option>F Minor</option><option>G Minor</option></select>
<label class="lab" for="cs">Style</label>
<select id="cs" class="fl" value="{{style}}" onChange="{{onStyle}}"><option>Boom bap</option><option>Trap</option><option>Lofi</option><option>Soul</option><option>Drill</option></select>
<div style="display:flex;align-items:center;gap:10px"><span class="lab" style="margin:0">Beats</span><button class="st" onClick="{{nbMinus}}" aria-label="Fewer beats">&minus;</button><span class="mk" style="font-size:30px;min-width:28px;text-align:center">{{nb}}</span><button class="st" onClick="{{nbPlus}}" aria-label="More beats">+</button></div>
</div>
<div style="display:flex;align-items:center;gap:14px;background:#151515;padding:12px 18px;border-radius:50% / 14%;transform:rotate(-1.5deg);box-shadow:3px 4px 0 rgba(0,0,0,.45)">
<svg width="92" height="108" viewBox="0 0 120 140" aria-label="Tempo flask"><defs><clipPath id="fc"><path d="M47 6H73V50L112 118Q116 130 104 130H16Q4 130 8 118L47 50Z"/></clipPath></defs>
<rect x="0" y="{{flaskY}}" width="120" height="{{flaskH}}" fill="{{main}}" clip-path="url(#fc)"/>
<path d="M47 6H73V50L112 118Q116 130 104 130H16Q4 130 8 118L47 50Z" fill="none" stroke="#f4efe0" stroke-width="4"/></svg>
<div style="text-align:center"><div class="mk" style="font-size:48px;line-height:1;color:{{main}}">{{bpm}}</div><div style="font-size:13px;color:#f4efe0;margin-bottom:6px">BPM</div>
<div style="display:flex;gap:8px;justify-content:center"><button class="st" style="background:#f4efe0;color:#151515" onClick="{{bpmMinus}}" aria-label="Slower">&minus;</button><button class="st" style="background:#f4efe0;color:#151515" onClick="{{bpmPlus}}" aria-label="Faster">+</button></div></div>
</div>
<div style="flex:1 1 190px;display:flex;flex-direction:column;gap:14px">
<label style="display:flex;align-items:center;gap:10px;font-size:16px;cursor:pointer"><input type="checkbox" checked="{{loops}}" onChange="{{toggleLoops}}" style="width:22px;height:22px;accent-color:#151515">Loops only <span style="font-size:13px;color:#444">{{modeWord}}</span></label>
<button onClick="{{generate}}" class="mk" style="height:76px;border:4px solid #151515;background:{{main}};font-size:28px;transform:rotate(-2deg);box-shadow:4px 5px 0 #151515">{{genLabel}}</button>
</div>
</div>
</div>
</div>

<div style="display:flex;gap:12px;flex-wrap:wrap;padding:2px 4px">
<button class="strip {{t1}}" onClick="{{tool1}}">Pattern Library</button>
<button class="strip {{t2}}" onClick="{{tool2}}">Breaks</button>
<button class="strip {{t3}}" onClick="{{tool3}}">Saved Beats</button>
<button class="strip {{t4}}" onClick="{{tool4}}">Famous Beats</button>
<button class="strip {{t5}}" onClick="{{tool5}}">Reference</button>
</div>

<div style="display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;flex:1">
<div style="flex:1.5 1 520px;display:flex;flex-direction:column;gap:20px;max-height:520px;overflow-y:auto;padding:10px 10px 14px 4px">
<sc-for list="{{beats}}" as="b" hint-placeholder-count="3">
<div class="card" style="{{b.card}}">
<div style="display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap">
<div><div class="mk" style="font-size:28px;line-height:1.1">{{b.t}}</div>
<div style="display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap"><sc-for list="{{b.tags}}" as="g" hint-placeholder-count="2"><span style="{{g.st}}">{{g.t}}</span></sc-for></div>
<div style="font-size:15px;color:#333">{{b.meta}}</div></div>
<div style="display:flex;gap:10px"><button class="stamp" style="{{b.passSt}}" onClick="{{b.pass}}">PASS</button><button class="stamp" style="{{b.failSt}}" onClick="{{b.fail}}">FAIL</button></div>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:10px">
<button onClick="{{b.play}}" aria-label="Play or pause" style="width:46px;height:46px;background:#151515;border:0;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:2px 2px 0 rgba(0,0,0,.35)">
<sc-if value="{{b.showPause}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 18 18" fill="#f4efe0" aria-hidden="true"><rect x="3" y="2" width="4" height="14"/><rect x="11" y="2" width="4" height="14"/></svg></sc-if>
<sc-if value="{{b.showPlay}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 18 18" fill="#f4efe0" aria-hidden="true"><path d="M4 2l12 7-12 7z"/></svg></sc-if>
</button>
<div style="flex:1;min-width:0;height:36px;display:flex;align-items:center;gap:2px"><sc-for list="{{b.bars}}" as="w" hint-placeholder-count="20"><span class="bar" style="{{w.st}}"></span></sc-for></div>
<span style="font-size:15px;color:#333;flex:none">{{b.time}}</span>
</div>
</div>
</sc-for>
</div>

<div style="flex:1 1 340px;padding-top:6px">
<div class="mk" style="font-size:26px;color:#f4efe0;margin-bottom:12px;transform:rotate(-1deg)">Elements &middot; 10 sounds</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="10">
<button class="note" onClick="{{t.pick}}" style="{{t.st}}"><span style="position:absolute;top:4px;left:8px;font-size:12px">{{t.n}}</span><span class="mk" style="font-size:28px;line-height:1">{{t.ab}}</span><span style="font-size:13px;color:#151515">{{t.nm}}</span></button>
</sc-for>
</div>
</div>
</div>

<div style="margin:0 -28px;padding:12px 28px;background:#111;border-top:4px solid #f4efe0;display:flex;align-items:center;gap:18px;flex-wrap:wrap">
<div style="min-width:170px"><div class="mk" style="font-size:22px;color:#f4efe0">{{npTitle}}</div><div style="font-size:14px;color:#cfcdc2">{{npMeta}}</div></div>
<div style="flex:1 1 240px;height:10px;background:#3a3a3a"><div style="height:100%;width:{{pct}}%;background:{{main}}"></div></div>
<span style="font-size:15px;color:#cfcdc2">{{npTime}}</span>
<button onClick="{{npPlay}}" aria-label="Play or pause" style="width:50px;height:50px;background:#f4efe0;border:0;display:flex;align-items:center;justify-content:center">
<sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 18 18" fill="#151515" aria-hidden="true"><rect x="3" y="2" width="4" height="14"/><rect x="11" y="2" width="4" height="14"/></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 18 18" fill="#151515" aria-hidden="true"><path d="M4 2l12 7-12 7z"/></svg></sc-if>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { tab:0, cls:0, key:'A Minor', style:'Boom bap', nb:3, bpm:96, loops:false, sel:0, playing:false, prog:0.18, tile:0, tool:0, gen:0,
    beats:[
      {t:'Stained Parade',tags:['BOOM BAP','ALTERNATIVE'],key:'A Minor',bpm:96,bars:8,len:20,seed:1,v:''},
      {t:'Stained Hymn',tags:['TRAP','ALTERNATIVE'],key:'A Minor',bpm:104,bars:8,len:18.5,seed:4,v:''},
      {t:'Satin Chorus',tags:['R&B','LOFI','SOUL'],key:'A Minor',bpm:92,bars:8,len:20.9,seed:9,v:''}
    ] };
  componentDidMount(){ this._t=setInterval(()=>{ if(this.state.playing){ let p=this.state.prog+0.012; if(p>=1)p=0; this.setState({prog:p}); } },200); }
  componentWillUnmount(){ clearInterval(this._t); }
  fmt(s){ const m=Math.floor(s/60), r=Math.floor(s%60); return m+':'+(r<10?'0':'')+r; }
  setV(i,v){ this.setState({beats:this.state.beats.map((b,k)=>k===i?Object.assign({},b,{v:b.v===v?'':v}):b)}); }
  generate(){
    const s=this.state, names=['Chalk Dust','Hall Pass','Back Row','Pop Quiz','Lunch Line','Bell Ringer','Detention','Recess'], add=[];
    for(let k=0;k<s.nb;k++){ const g=s.gen+k; add.push({t:names[g%names.length]+(g>=names.length?' '+(Math.floor(g/names.length)+1):''),tags:[s.style.toUpperCase(),s.loops?'LOOP':'ORIGINAL'],key:s.key,bpm:s.bpm,bars:8,len:Math.round(1920/s.bpm)/10,seed:g*3+2,v:''}); }
    this.setState({beats:add.concat(s.beats),gen:s.gen+s.nb,sel:0,prog:0,playing:true});
  }
  renderVals(){
    const s=this.state, set=(o)=>()=>this.setState(o);
    const main=s.loops?'#9be22d':'#ff8a3d';
    const NOTE=['#ff9f5a','#c9a8ff','#7fd0ff','#b7ea52'];
    const crews=[['Otto Grit','Cutz','Crate Prophet','Chrome Dial'],['Farrow','Doc Day','Kane East','J Dillo']];
    const people=crews[s.tab].map((n,i)=>({n,ini:n.split(' ').map(w=>w[0]).join(''),pick:set({cls:i}),
      st:'background:#fff;border:0;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:2px 3px 0 rgba(0,0,0,.45);transform:rotate('+(i%2?'2':'-2')+'deg);outline:'+(s.cls===i?'4px solid '+main:'none'),
      pic:'width:64px;height:64px;background:'+NOTE[i]+';display:flex;align-items:center;justify-content:center;font-size:28px'}));
    const beats=s.beats.map((b,i)=>{
      const on=s.sel===i, bars=[];
      for(let k=0;k<64;k++){ const h=5+Math.round(Math.abs(Math.sin((k+b.seed)*0.9)*Math.cos(k*0.33+b.seed*1.7))*26+(k%4===0?5:0)); const lit=on&&k/64<s.prog; bars.push({st:'height:'+h+'px;background:'+(lit?main:'#151515')+';opacity:'+(lit?1:0.45)}); }
      return {t:b.t,meta:b.key+'  |  '+b.bpm+' BPM  |  4/4  |  '+b.bars+' bars  |  0:'+(Math.round(b.len)<10?'0':'')+Math.round(b.len),
        tags:b.tags.map((g,k)=>({t:g,st:'font-size:12px;padding:2px 8px;background:'+NOTE[(k+i)%4]+';color:#151515;transform:rotate(-1deg)'})),
        card:'transform:rotate('+(i%2?'.5':'-.5')+'deg);'+(on?'outline:4px solid '+main+';outline-offset:2px;':'')+(b.v==='fail'?'opacity:.5;':''),
        passSt:b.v==='pass'?'border-color:#1f7a2a;color:#1f7a2a':'',failSt:b.v==='fail'?'border-color:#c0261c;color:#c0261c':'',
        pass:()=>this.setV(i,'pass'),fail:()=>this.setV(i,'fail'),
        play:()=>{ if(on) this.setState({playing:!s.playing}); else this.setState({sel:i,prog:0,playing:true}); },
        showPause:on&&s.playing,showPlay:!(on&&s.playing),bars,time:(on?this.fmt(s.prog*b.len):'0:00')+' / '+this.fmt(b.len)};
    });
    const TL=[['Kk','Kick',0],['Sn','Snare',1],['Hh','Hats',2],['Bs','Bass',3],['Ch','Chords',1],['Sm','Sample',2],['Pd','Pad',3],['Ld','Lead',0],['Pc','Percussion',2],['Fx','Texture',1]];
    const tiles=TL.map((t,i)=>{ const on=s.tile===i; return {n:(i<9?'0':'')+(i+1),ab:t[0],nm:t[1],pick:set({tile:i}),st:'background:'+NOTE[t[2]]+';transform:rotate('+((i%3)-1)*1.6+'deg);'+(on?'outline:4px solid #f4efe0;outline-offset:2px;':'')}; });
    const cur=s.beats[s.sel], tb=(n)=>s.tool===n?'on':'', hh=14+(s.bpm-60)/140*100;
    return {people,beats,tiles,main,key:s.key,style:s.style,nb:s.nb,bpm:s.bpm,loops:s.loops,playing:s.playing,paused:!s.playing,
      tab0cls:s.tab===0?'on':'',tab1cls:s.tab===1?'on':'',goBack:set({tab:0,cls:0}),goLegends:set({tab:1,cls:0}),
      onKey:(e)=>this.setState({key:e.target.value}),onStyle:(e)=>this.setState({style:e.target.value}),
      nbMinus:set({nb:Math.max(1,s.nb-1)}),nbPlus:set({nb:Math.min(10,s.nb+1)}),
      bpmMinus:set({bpm:Math.max(60,s.bpm-4)}),bpmPlus:set({bpm:Math.min(200,s.bpm+4)}),
      flaskY:130-hh,flaskH:hh,toggleLoops:set({loops:!s.loops}),modeWord:s.loops?'Loop mode':'Beat mode',genLabel:s.loops?'Generate Loops':'Generate Beats',
      generate:()=>this.generate(),
      t1:tb(1),t2:tb(2),t3:tb(3),t4:tb(4),t5:tb(5),tool1:set({tool:s.tool===1?0:1}),tool2:set({tool:s.tool===2?0:2}),tool3:set({tool:s.tool===3?0:3}),tool4:set({tool:s.tool===4?0:4}),tool5:set({tool:s.tool===5?0:5}),
      npTitle:cur.t,npMeta:cur.key+' · '+cur.bpm+' BPM',pct:Math.round(s.prog*100),npTime:this.fmt(s.prog*cur.len)+' / '+this.fmt(cur.len),npPlay:set({playing:!s.playing})};
  }
}
</script>
</body>
</html>
