<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook and Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Special+Elite&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2b1f15}
*{box-sizing:border-box}
button,select,input{font-family:'Special Elite',monospace}
button{cursor:pointer}
.ink{font-family:'Caveat',cursive;font-weight:700;color:#1f3f9a}
.paper{background:#fff3a6;background-image:repeating-linear-gradient(transparent 0 31px,#9db8e0 31px 32px);}
.pl{font-size:14px;color:#2b2b2b;display:block;margin-bottom:2px}
.pf{width:100%;height:34px;background:transparent;border:0;border-bottom:2px solid #1f3f9a;font-size:17px;color:#1f3f9a;padding:0 4px;border-radius:0}
.pf option{background:#fff3a6;color:#1f3f9a}
.stp{width:36px;height:36px;border-radius:50%;background:none;border:2px solid #1f3f9a;color:#1f3f9a;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.ptab{background:none;border:0;border-bottom:3px solid transparent;font-size:16px;color:#5a5a4a;padding:6px 4px}
.ptab.on{color:#1f3f9a;border-bottom-color:#d6332a}
.flip{width:46px;height:96px;border:0;border-radius:0 10px 10px 0;font-size:15px;writing-mode:vertical-rl;text-orientation:mixed;color:#1a1a1a;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.bd{font-family:'Patrick Hand',system-ui,sans-serif;color:#f1efe6}
.bd button,.bd select,.bd input{font-family:'Patrick Hand',system-ui,sans-serif;color:#f1efe6}
.mini{height:36px;padding:0 14px;background:none;border:2px solid rgba(244,244,236,.5);border-radius:9px;font-size:18px}
.bar{width:3px;border-radius:2px;flex:none}
.tile{aspect-ratio:1/0.92;border-radius:10px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:4px}
.trow{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid transparent;text-align:left;font-size:18px;color:#1f3f9a;height:64px;padding:0 6px}
.trow.on{background:rgba(214,51,42,.10)}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter></svg>

<div style="width:100%;min-height:900px;padding:22px;background:radial-gradient(900px 600px at 30% 20%,#4a3524,#2b1f15);display:flex;gap:0;flex-wrap:wrap;align-items:flex-start">

<div style="position:relative;flex:0 0 440px;max-width:100%;min-height:856px;margin-right:40px">
<div class="paper" style="position:relative;min-height:856px;border-radius:6px 12px 12px 6px;padding:22px 24px 24px 74px;box-shadow:4px 6px 14px rgba(0,0,0,.5);color:#2b2b2b;font-family:'Special Elite',monospace">
<div style="position:absolute;left:58px;top:0;bottom:0;width:2px;background:#d6332a;opacity:.7"></div>
<div style="position:absolute;left:-12px;top:30px;bottom:30px;display:flex;flex-direction:column;justify-content:space-between" aria-hidden="true"><sc-for list="{{rings}}" as="r" hint-placeholder-count="14"><span style="display:block;width:44px;height:12px;border-radius:6px;background:linear-gradient(#e8e8e8,#777);box-shadow:0 2px 2px rgba(0,0,0,.5)"></span></sc-for></div>

<sc-if value="{{pageMake}}" hint-placeholder-val="{{true}}">
<div>
<div class="ink" style="font-size:40px;line-height:1">The Back of the Class</div>
<div style="display:flex;margin:6px 0 10px"><button class="ptab {{tab0cls}}" onClick="{{goBack}}">The Crew</button><button class="ptab {{tab1cls}}" onClick="{{goLegends}}">The Legends</button></div>
<div style="display:flex;gap:8px;justify-content:space-between;margin-bottom:12px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="4">
<button onClick="{{p.pick}}" aria-label="{{p.n}}" style="background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0">
<span class="ink" style="{{p.circ}}">{{p.ini}}</span>
<span style="font-size:12px;color:#2b2b2b">{{p.n}}</span>
</button>
</sc-for>
</div>
<label class="pl" for="bk">Key</label>
<select id="bk" class="pf" value="{{key}}" onChange="{{onKey}}"><option>A Minor</option><option>C Minor</option><option>D Minor</option><option>F Minor</option><option>G Minor</option></select>
<label class="pl" for="bs" style="margin-top:8px">Style</label>
<select id="bs" class="pf" value="{{style}}" onChange="{{onStyle}}"><option>Boom bap</option><option>Trap</option><option>Lofi</option><option>Soul</option><option>Drill</option></select>
<div style="display:flex;align-items:center;gap:10px;margin:14px 0 6px"><span style="font-size:15px">Number of beats</span><button class="stp" onClick="{{nbMinus}}" aria-label="Fewer beats">&minus;</button><span class="ink" style="font-size:30px;min-width:24px;text-align:center">{{nb}}</span><button class="stp" onClick="{{nbPlus}}" aria-label="More beats">+</button></div>
<div style="display:flex;align-items:center;gap:14px;margin-top:8px">
<svg width="112" height="132" viewBox="0 0 120 140" aria-label="Tempo flask"><defs><clipPath id="fc"><path d="M47 6H73V50L112 118Q116 130 104 130H16Q4 130 8 118L47 50Z"/></clipPath></defs>
<rect x="0" y="{{flaskY}}" width="120" height="{{flaskH}}" fill="{{main}}" clip-path="url(#fc)" opacity=".9"/>
<path d="M47 6H73V50L112 118Q116 130 104 130H16Q4 130 8 118L47 50Z" fill="none" stroke="#1f3f9a" stroke-width="3" filter="url(#rough)"/></svg>
<div style="text-align:center"><div class="ink" style="font-size:56px;line-height:1">{{bpm}}</div><div style="font-size:14px;margin-bottom:6px">BPM</div>
<div style="display:flex;gap:8px;justify-content:center"><button class="stp" onClick="{{bpmMinus}}" aria-label="Slower">&minus;</button><button class="stp" onClick="{{bpmPlus}}" aria-label="Faster">+</button></div></div>
</div>
<label style="display:flex;align-items:center;gap:10px;font-size:16px;margin:16px 0 10px;cursor:pointer"><input type="checkbox" checked="{{loops}}" onChange="{{toggleLoops}}" style="width:20px;height:20px;accent-color:#1f3f9a">Loops only <span style="font-size:13px;color:#555">{{modeWord}}</span></label>
<button onClick="{{generate}}" class="ink" style="width:100%;height:64px;border:3px solid {{main}};border-radius:6px;background:{{mainSoft}};color:#1a1a1a;font-size:32px;transform:rotate(-1deg)">{{genLabel}}</button>
</div>
</sc-if>

<sc-if value="{{pageTools}}" hint-placeholder-val="{{false}}">
<div>
<div class="ink" style="font-size:40px;line-height:1;margin-bottom:10px">Toolbox</div>
<sc-for list="{{toolRows}}" as="r" hint-placeholder-count="5">
<button class="trow {{r.on}}" onClick="{{r.pick}}"><span class="ink" style="font-size:30px;width:34px">{{r.n}}</span><span><span class="ink" style="font-size:26px;display:block;line-height:1">{{r.t}}</span><span style="font-size:13px;color:#444">{{r.d}}</span></span></button>
</sc-for>
</div>
</sc-if>
</div>
<div style="position:absolute;right:-44px;top:60px;display:flex;flex-direction:column;gap:10px">
<button class="flip" style="background:#ff8a3d" onClick="{{goMake}}">Make</button>
<button class="flip" style="background:#9be22d" onClick="{{goTools}}">Toolbox</button>
</div>
</div>

<div style="flex:1 1 640px;min-width:0;padding:16px;background:linear-gradient(135deg,#8a6038,#5a3d22 48%,#7b5533);border-radius:6px;box-shadow:4px 6px 14px rgba(0,0,0,.5)">
<div class="bd" style="position:relative;min-height:824px;background:radial-gradient(700px 500px at 20% 10%,#262c29,transparent 70%),#181b19;box-shadow:inset 0 0 40px rgba(0,0,0,.7);padding:18px 22px 0;display:flex;flex-direction:column;gap:14px">
<svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.07;pointer-events:none" aria-hidden="true"><filter id="dust"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#dust)"/></svg>
<div style="position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
<div><div style="font-size:44px;letter-spacing:.26em;line-height:1">HOMEROOM</div><div style="font-family:'Special Elite',monospace;font-size:13px;letter-spacing:.5em;color:#cfcdc2;margin-top:6px">STUDIOS &middot; music starts here</div></div>
<img src="/_blob/31c4430f36130632788d41344c8012d5" alt="The Back of the Class logo" style="width:80px;height:80px;object-fit:cover;border:2px solid rgba(244,244,236,.6);border-radius:6px">
</div>

<div style="position:relative;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;flex:1">
<div style="flex:1.5 1 440px;display:flex;flex-direction:column;gap:12px;max-height:640px;overflow-y:auto;padding:2px 6px 4px 2px">
<sc-for list="{{beats}}" as="b" hint-placeholder-count="3">
<div style="{{b.card}}">
<div style="display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap">
<div><div style="font-size:28px;line-height:1.1">{{b.t}}</div>
<div style="display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap"><sc-for list="{{b.tags}}" as="g" hint-placeholder-count="2"><span style="{{g.st}}">{{g.t}}</span></sc-for></div>
<div style="font-size:17px;color:#cfcdc2">{{b.meta}}</div></div>
<div style="display:flex;gap:8px"><button class="mini" style="{{b.passSt}}" onClick="{{b.pass}}">Pass</button><button class="mini" style="{{b.failSt}}" onClick="{{b.fail}}">Fail</button></div>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:10px">
<button onClick="{{b.play}}" aria-label="Play or pause" style="width:46px;height:46px;border-radius:50%;border:2.5px solid #f1efe6;background:none;display:flex;align-items:center;justify-content:center;flex:none">
<sc-if value="{{b.showPause}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 18 18" fill="#f1efe6" aria-hidden="true"><rect x="3" y="2" width="4" height="14"/><rect x="11" y="2" width="4" height="14"/></svg></sc-if>
<sc-if value="{{b.showPlay}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 18 18" fill="#f1efe6" aria-hidden="true"><path d="M4 2l12 7-12 7z"/></svg></sc-if>
</button>
<div style="flex:1;min-width:0;height:36px;display:flex;align-items:center;gap:2px"><sc-for list="{{b.bars}}" as="w" hint-placeholder-count="20"><span class="bar" style="{{w.st}}"></span></sc-for></div>
<span style="font-size:17px;color:#cfcdc2;flex:none">{{b.time}}</span>
</div>
</div>
</sc-for>
</div>
<div style="flex:1 1 260px;border:2px dashed rgba(244,244,236,.4);border-radius:12px;padding:14px">
<div style="font-size:24px;color:#f6e04b;margin-bottom:10px">Elements &middot; 10 sounds</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="10">
<button class="tile" onClick="{{t.pick}}" style="{{t.st}}"><span style="position:absolute;top:4px;left:8px;font-size:13px;opacity:.8">{{t.n}}</span><span style="font-size:28px;line-height:1">{{t.ab}}</span><span style="font-size:14px;color:#d9d7cb">{{t.nm}}</span></button>
</sc-for>
</div>
</div>
</div>

<div style="position:relative;margin:0 -22px;padding:10px 24px;background:linear-gradient(#7b5533,#5a3d22);box-shadow:0 -3px 8px rgba(0,0,0,.5);display:flex;align-items:center;gap:18px;flex-wrap:wrap">
<div style="min-width:170px"><div style="font-size:21px">{{npTitle}}</div><div style="font-size:15px;color:#efe3cf">{{npMeta}}</div></div>
<div style="flex:1 1 200px;height:8px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden"><div style="height:100%;width:{{pct}}%;background:{{main}}"></div></div>
<span style="font-size:17px;color:#efe3cf">{{npTime}}</span>
<button onClick="{{npPlay}}" aria-label="Play or pause" style="width:48px;height:48px;border-radius:50%;border:2.5px solid #f1efe6;background:none;display:flex;align-items:center;justify-content:center">
<sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 18 18" fill="#f1efe6" aria-hidden="true"><rect x="3" y="2" width="4" height="14"/><rect x="11" y="2" width="4" height="14"/></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 18 18" fill="#f1efe6" aria-hidden="true"><path d="M4 2l12 7-12 7z"/></svg></sc-if>
</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { page:0, tab:0, cls:0, key:'A Minor', style:'Boom bap', nb:3, bpm:96, loops:false, sel:0, playing:false, prog:0.18, tile:0, tool:0, gen:0,
    beats:[
      {t:'Stained Parade',tags:['BOOM BAP','ALTERNATIVE'],key:'A Minor',bpm:96,bars:8,len:20,seed:1,v:''},
      {t:'Stained Hymn',tags:['TRAP','ALTERNATIVE'],key:'A Minor',bpm:104,bars:8,len:18.5,seed:4,v:''},
      {t:'Satin Chorus',tags:['R&B','LOFI','SOUL'],key:'A Minor',bpm:92,bars:8,len:20.9,seed:9,v:''}
    ] };
  componentDidMount(){ this._t=setInterval(()=>{ if(this.state.playing){ let p=this.state.prog+0.012; if(p>=1)p=0; this.setState({prog:p}); } },200); }
  componentWillUnmount(){ clearInterval(this._t); }
  fmt(s){ const m=Math.floor(s/60), r=Math.floor(s%60); return m+':'+(r<10?'0':'')+r; }
  setV(i,v){ this.setState({beats:this.state.beats.map((b,k)=>k===i?Object.assign({},b,{v:b.v===v?'':v}):b)}); }
  generate(){
    const s=this.state, names=['Chalk Dust','Hall Pass','Back Row','Pop Quiz','Lunch Line','Bell Ringer','Detention','Recess'], add=[];
    for(let k=0;k<s.nb;k++){ const g=s.gen+k; add.push({t:names[g%names.length]+(g>=names.length?' '+(Math.floor(g/names.length)+1):''),tags:[s.style.toUpperCase(),s.loops?'LOOP':'ORIGINAL'],key:s.key,bpm:s.bpm,bars:8,len:Math.round(1920/s.bpm)/10,seed:g*3+2,v:''}); }
    this.setState({beats:add.concat(s.beats),gen:s.gen+s.nb,sel:0,prog:0,playing:true});
  }
  renderVals(){
    const s=this.state, set=(o)=>()=>this.setState(o);
    const main=s.loops?'#6fae12':'#ff8a3d', mainBoard=s.loops?'#9be22d':'#ff8a3d';
    const ACC=['#ff8a3d','#b58cff','#5bc0ff','#9be22d'];
    const crews=[['Otto Grit','Cutz','Crate Prophet','Chrome Dial'],['Farrow','Doc Day','Kane East','J Dillo']];
    const people=crews[s.tab].map((n,i)=>({n,ini:n.split(' ').map(w=>w[0]).join(''),pick:set({cls:i}),circ:'width:62px;height:62px;border-radius:50%;border:3px '+(s.cls===i?'solid #d6332a':'dashed #1f3f9a')+';display:flex;align-items:center;justify-content:center;font-size:30px;'+(s.cls===i?'background:rgba(214,51,42,.12)':'')}));
    const beats=s.beats.map((b,i)=>{
      const on=s.sel===i, bars=[];
      for(let k=0;k<64;k++){ const h=5+Math.round(Math.abs(Math.sin((k+b.seed)*0.9)*Math.cos(k*0.33+b.seed*1.7))*26+(k%4===0?5:0)); const lit=on&&k/64<s.prog; bars.push({st:'height:'+h+'px;background:'+(lit?mainBoard:'#cfcfc4')+';opacity:'+(lit?1:0.5)}); }
      const chips=['#ff8a3d','#b58cff','#5bc0ff'];
      return {t:b.t,meta:b.key+'  |  '+b.bpm+' BPM  |  4/4  |  '+b.bars+' bars  |  0:'+(Math.round(b.len)<10?'0':'')+Math.round(b.len),
        tags:b.tags.map((g,k)=>({t:g,st:'font-family:Special Elite,monospace;font-size:12px;padding:2px 8px;border:1.5px solid '+chips[k%3]+';color:'+chips[k%3]+';border-radius:4px'})),
        card:'padding:14px 18px;border:2px solid '+(on?mainBoard:'rgba(244,244,236,.35)')+';border-radius:12px 16px 10px 14px;background:'+(on?'rgba(255,255,255,.06)':'rgba(255,255,255,.02)')+';'+(b.v==='fail'?'opacity:.45;':''),
        passSt:b.v==='pass'?'border-color:#9be22d;color:#9be22d':'',failSt:b.v==='fail'?'border-color:#ff6b5e;color:#ff6b5e':'',
        pass:()=>this.setV(i,'pass'),fail:()=>this.setV(i,'fail'),
        play:()=>{ if(on) this.setState({playing:!s.playing}); else this.setState({sel:i,prog:0,playing:true}); },
        showPause:on&&s.playing,showPlay:!(on&&s.playing),bars,time:(on?this.fmt(s.prog*b.len):'0:00')+' / '+this.fmt(b.len)};
    });
    const TL=[['Kk','Kick',0],['Sn','Snare',1],['Hh','Hats',2],['Bs','Bass',3],['Ch','Chords',1],['Sm','Sample',2],['Pd','Pad',3],['Ld','Lead',0],['Pc','Percussion',2],['Fx','Texture',1]];
    const tiles=TL.map((t,i)=>{ const c=ACC[t[2]], on=s.tile===i; return {n:(i<9?'0':'')+(i+1),ab:t[0],nm:t[1],pick:set({tile:i}),st:'border:2px '+(on?'solid':'dashed')+' '+c+';color:'+c+';'+(on?'background:'+c+'26;':'')}; });
    const TR=[['Pattern Library','260 drum patterns to start from'],['Breaks','Chop-ready break loops'],['Saved Beats','Everything you passed'],['Famous Beats','Match a classic groove'],['Reference','Drop a track to match its tempo']];
    const toolRows=TR.map((r,i)=>({n:String(i+1),t:r[0],d:r[1],on:s.tool===i+1?'on':'',pick:set({tool:s.tool===i+1?0:i+1})}));
    const cur=s.beats[s.sel], hh=14+(s.bpm-60)/140*100;
    return {people,beats,tiles,toolRows,main:mainBoard,mainSoft:s.loops?'rgba(111,174,18,.22)':'rgba(255,138,61,.25)',key:s.key,style:s.style,nb:s.nb,bpm:s.bpm,loops:s.loops,playing:s.playing,paused:!s.playing,
      rings:Array.from({length:14}),pageMake:s.page===0,pageTools:s.page===1,goMake:set({page:0}),goTools:set({page:1}),
      tab0cls:s.tab===0?'on':'',tab1cls:s.tab===1?'on':'',goBack:set({tab:0,cls:0}),goLegends:set({tab:1,cls:0}),
      onKey:(e)=>this.setState({key:e.target.value}),onStyle:(e)=>this.setState({style:e.target.value}),
      nbMinus:set({nb:Math.max(1,s.nb-1)}),nbPlus:set({nb:Math.min(10,s.nb+1)}),
      bpmMinus:set({bpm:Math.max(60,s.bpm-4)}),bpmPlus:set({bpm:Math.min(200,s.bpm+4)}),
      flaskY:130-hh,flaskH:hh,toggleLoops:set({loops:!s.loops}),modeWord:s.loops?'Loop mode':'Beat mode',genLabel:s.loops?'Generate Loops':'Generate Beats',
      generate:()=>this.generate(),
      npTitle:cur.t,npMeta:cur.key+' · '+cur.bpm+' BPM',pct:Math.round(s.prog*100),npTime:this.fmt(s.prog*cur.len)+' / '+this.fmt(cur.len),npPlay:set({playing:!s.playing})};
  }
}
</script>
</body>
</html>
